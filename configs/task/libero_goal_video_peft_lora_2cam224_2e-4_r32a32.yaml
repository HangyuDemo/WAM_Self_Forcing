# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_video_peft_lora
  - _self_

batch_size: 8
num_workers: 8

data:
  train:
    dataset_dirs:
      - ${oc.env:DATASET_ROOT,/home/ha865618/data/LIBERO_Lerobot/libero_goal}

model:
  mot_checkpoint_mixed_attn: false
  lora:
    rank: 32
    alpha: 32.0

lr_scheduler_type: "cosine"
learning_rate: 2e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: ${oc.env:BASE_RESUME,null}

# During training eval, only render:
# top row = predicted video
# bottom row = simulator rollout after executing predicted action.
eval_output_video_mode: local_init_then_online_rollout
eval_rollout_task_suite_name: libero_goal
eval_rollout_task_id: 0
eval_rollout_env_trial_index: 0
eval_replan_steps: 10
eval_num_steps_wait: 30
